/* ---------- ENGINE ---------- */
let state = { node:"start", clarity:5, nerve:5, visited:{}, flags:{} };
const FOLD_NODES = new Set(['c7_montage1','c18_montage1','c22_blackout_montage']);

function tier(){
  const avg = (state.clarity+state.nerve)/2;
  return avg<=3.5 ? "low" : avg>=7 ? "high" : "mid";
}
function pickText(node){
  if(state.visited[state.node] && node.repeatText) return node.repeatText;
  if(typeof node.text === "string") return node.text;
  const t = tier();
  return node.text[t] || node.text.mid || Object.values(node.text)[0];
}
function checkTag(label){
  if(/run|push|demand|confront|burn|strike a match|hold your ground/i.test(label)) return {stat:'nerve', d:6};
  if(/wait|stay quiet|let it drop|leave|calm|hide|stillness/i.test(label)) return {stat:'nerve', d:4};
  if(/pills|take one|drink/i.test(label)) return {stat:'clarity', d:5};
  if(/remember|read|search|evidence|cross-reference|timeline/i.test(label)) return {stat:'clarity', d:6};
  return null;
}

function beep(freq, dur, type){
  try{
    const ctx = window.__audioCtx || (window.__audioCtx = new (window.AudioContext||window.webkitAudioContext)());
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = type||'square'; o.frequency.value = freq;
    g.gain.value = 0.05;
    o.connect(g); g.connect(ctx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    o.stop(ctx.currentTime+dur);
  }catch(e){}
}

function showCheck(stat, pass, cb){
  const banner = document.getElementById('check-banner');
  const isWhite = stat==='clarity';
  document.getElementById('check-label').textContent = (isWhite?'STEADY':'LIVE')+' CHECK — '+stat.toUpperCase()+(isWhite?'':' (no going back)');
  const diceEl = document.getElementById('check-dice');
  const d1 = Math.ceil(Math.random()*6), d2 = Math.ceil(Math.random()*6);
  const cls = stat==='clarity' ? 'white' : 'red';
  diceEl.innerHTML = `<div class="die ${cls}">${d1}</div><div class="die ${cls}">${d2}</div>`;
  const r = document.getElementById('check-result');
  r.textContent = ''; r.className = 'result';
  banner.classList.add('show');
  beep(320,0.08,'square');
  setTimeout(()=>{
    r.textContent = pass ? 'SUCCESS' : 'FAILURE';
    r.className = 'result '+(pass?'pass':'fail');
    beep(pass?660:170, pass?0.2:0.32, pass?'square':'sawtooth');
  }, 500);
  setTimeout(()=>{ banner.classList.remove('show'); cb && cb(); }, 1500);
}

/* ---------- TYPEWRITER ---------- */
function revealText(container, html, thoughtHtml, onDone){
  container.classList.add('typing');
  container.innerHTML = '';
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  const paras = Array.from(tmp.children);
  let pi = 0;
  let skip = false;
  const skipHandler = ()=>{ skip = true; };
  container.addEventListener('click', skipHandler);

  function typePara(){
    if(pi >= paras.length){
      container.classList.remove('typing');
      container.removeEventListener('click', skipHandler);
      if(thoughtHtml){
        const t = document.createElement('div');
        t.innerHTML = thoughtHtml;
        container.appendChild(t.firstChild);
        requestAnimationFrame(()=> container.querySelector('.thought') && container.querySelector('.thought').classList.add('reveal'));
      }
      onDone && onDone();
      return;
    }
    const p = document.createElement('p');
    container.appendChild(p);
    const plain = paras[pi].textContent;
    let ci = 0;
    skip = false;
    const speed = Math.max(14, Math.min(34, 1400/plain.length));
    const timer = setInterval(()=>{
      if(skip){ ci = plain.length; }
      else { ci += 1; }
      p.textContent = plain.slice(0, ci);
      if(ci >= plain.length){
        clearInterval(timer);
        pi++;
        setTimeout(typePara, 120);
      }
    }, speed);
  }
  typePara();
}

function render(){
  const node = S[state.node];
  const main = document.getElementById('main');
  const choicesEl = document.getElementById('choices');
  const evEl = document.getElementById('evidence-bar');

  if(node.flag) state.flags[node.flag]=true;
  renderBackdrop(state.node);
  renderPortrait(state.node);

  if(node.ending){
    main.innerHTML = `<div id="end-screen" class="fade">
      <h2>End of Night — ${node.ending}</h2>
      <div id="scene-text">${paragraphs(pickText(node))}</div>
      <button id="restart">Begin again</button>
    </div>`;
    choicesEl.innerHTML=""; evEl.innerHTML="";
    document.getElementById('restart').onclick = ()=>{
      state = { node:"start", clarity:5, nerve:5, visited:{}, flags:{} };
      render();
    };
    saveState(); updateStats();
    return;
  }

  const txt = pickText(node);
  main.innerHTML = `<div id="scene-text" class="fade"></div>`;
  const sceneTextEl = document.getElementById('scene-text');
  const thoughtVoice = node.thought ? classifyVoice(node.thought) : null;
  const thoughtHtml = node.thought ? `<span class="thought ${thoughtVoice.cls}"><span class="voice-tag ${thoughtVoice.cls}">${thoughtVoice.name}</span>${escapeHtml(node.thought)}</span>` : '';
  if(node.thought) maybeDiscoverThought(node.thought);
  choicesEl.classList.add('hidden');
  choicesEl.innerHTML="";
  revealText(sceneTextEl, paragraphs(txt), thoughtHtml, ()=>{ choicesEl.classList.remove('hidden'); });

  buildChoices();
  function buildChoices(){
  node.choices.forEach(([label,target])=>{
    const b = document.createElement('button');
    b.className='choice';
    const tag = checkTag(label);
    b.innerHTML = escapeHtml(label) + (tag ? `<span class="tag">${tag.stat==='clarity'?'STEADY':'LIVE'} — ${tag.stat.toUpperCase()}</span>` : '');
    b.onclick = ()=>{
      beep(320,0.06,'square');
      const advance = ()=>{
        state.visited[state.node]=true;
        state.node = target;
        if(/run|push|demand|confront|burn/i.test(label)) state.nerve = clamp(state.nerve-1);
        if(/wait|stay quiet|let it drop|leave|calm/i.test(label)) state.nerve = clamp(state.nerve+1);
        if(/pills|take one|drink/i.test(label)) state.clarity = clamp(state.clarity-1);
        if(/remember|read|search|evidence/i.test(label)) state.clarity = clamp(state.clarity+1);
        tickThoughts();

        if(FOLD_NODES.has(target)){
          runMinigame(()=>{ render(); window.scrollTo(0,0); });
          return;
        }
        render();
        window.scrollTo(0,0);
      };
      if(tag){
        const val = state[tag.stat];
        const pass = val + Math.floor(Math.random()*4) >= tag.d;
        showCheck(tag.stat, pass, advance);
      } else {
        advance();
      }
    };
    choicesEl.appendChild(b);
  });
  }

  evEl.innerHTML = Object.keys(state.flags).map(f=>`<span class="ev-chip">${flagLabel(f)}</span>`).join('');
  updateStats();
  saveState();
}

function flagLabel(f){
  return {matchbook:"Matchbook",pills:"Pill bottle",tin:"Tin",receipt:"Receipt",gascan:"Gas can",photo:"Photograph",card:"White card"}[f]||f;
}

/* ---------- INNER VOICES (skill archetypes) ---------- */
const VOICES = [
  {id:'record', name:'THE RECORD', cls:'v-logic', re:/logic|evidence|fact|deduce|proof|timeline|line up|add up|clean/i, stat:'clarity'},
  {id:'static', name:'THE STATIC', cls:'v-empire', re:/remember|memory|dream|vision|real or not|impossible|ghost/i, stat:'clarity'},
  {id:'spine', name:'THE SPINE', cls:'v-volition', re:/should|discipline|resolve|stand|refuse|decide|not going to|last chance/i, stat:'nerve'},
  {id:'pulse', name:'THE PULSE', cls:'v-physical', re:/hurt|pain|body|run|fight|survive|blood|throb/i, stat:'nerve'},
  {id:'ache', name:'THE ACHE', cls:'v-empathy', re:/she|her|sorry|care|protect|gift|kindness/i, stat:'clarity'},
];
function classifyVoice(text){
  for(const v of VOICES){ if(v.re.test(text)) return v; }
  return {id:'hunch', name:'THE HUNCH', cls:'v-suggestion', stat:'clarity'};
}

/* ---------- THE MATCHBOOK (thought-collection system) ---------- */
function initThoughts(){
  if(!state.thoughts) state.thoughts = { seen:{}, slots:[], done:[] };
}
const CABINET_SLOTS = 3; // three matches — matches the title
const RESEARCH_TICKS = 4;

function maybeDiscoverThought(text){
  initThoughts();
  if(state.thoughts.seen[text]) return;
  const voice = classifyVoice(text);
  state.thoughts.seen[text] = {text, voiceId:voice.id, voiceName:voice.name, voiceCls:voice.cls, stat:voice.stat, slotted:false, done:false};
  showThoughtToast('SOMETHING CAUGHT: '+voice.name);
  document.getElementById('cabinet-badge').classList.add('on');
}
function showThoughtToast(msg){
  const t = document.getElementById('thought-toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}
function tickThoughts(){
  initThoughts();
  let changed = false;
  state.thoughts.slots.forEach(s=>{
    if(!s.done){
      s.ticks++;
      if(s.ticks >= RESEARCH_TICKS){
        s.done = true;
        const entry = state.thoughts.seen[s.text];
        if(entry){ entry.done = true; entry.slotted = false; }
        if(s.stat === 'clarity') state.clarity = clamp(state.clarity+1);
        else state.nerve = clamp(state.nerve+1);
        showThoughtToast('BURNED IN: '+s.voiceName);
        changed = true;
      }
    }
  });
  if(changed){
    state.thoughts.done.push(...state.thoughts.slots.filter(s=>s.done).map(s=>({text:s.text, voiceName:s.voiceName, voiceCls:s.voiceCls})));
    state.thoughts.slots = state.thoughts.slots.filter(s=>!s.done);
  }
}
function slotThought(text){
  initThoughts();
  if(state.thoughts.slots.length >= CABINET_SLOTS) return;
  const entry = state.thoughts.seen[text];
  if(!entry || entry.slotted || entry.done) return;
  entry.slotted = true;
  state.thoughts.slots.push({text, voiceName:entry.voiceName, voiceCls:entry.voiceCls, stat:entry.stat, ticks:0});
  renderCabinet();
  saveState();
}
function renderCabinet(){
  initThoughts();
  const slotsEl = document.getElementById('cab-slots');
  const discEl = document.getElementById('cab-discovered');
  const doneEl = document.getElementById('cab-done');

  slotsEl.innerHTML = state.thoughts.slots.length ? state.thoughts.slots.map(s=>`
    <div class="cab-item"><span class="voice-tag ${s.voiceCls}">${s.voiceName}</span>${escapeHtml(s.text)}
    <div class="prog">catching — ${s.ticks}/${RESEARCH_TICKS}</div></div>`).join('')
    : `<div class="cab-empty">Nothing being internalised yet.</div>`;

  const unslotted = Object.values(state.thoughts.seen).filter(t=>!t.slotted && !t.done);
  discEl.innerHTML = unslotted.length ? unslotted.map(t=>`
    <div class="cab-item clickable" data-text="${escapeHtml(t.text)}"><span class="voice-tag ${t.voiceCls}">${t.voiceName}</span>${escapeHtml(t.text)}
    <div class="prog">tap to strike${state.thoughts.slots.length>=CABINET_SLOTS?' — no matches left':''}</div></div>`).join('')
    : `<div class="cab-empty">No unslotted thoughts.</div>`;
  discEl.querySelectorAll('.cab-item.clickable').forEach(el=>{
    el.onclick = ()=> slotThought(el.dataset.text);
  });

  doneEl.innerHTML = state.thoughts.done.length ? state.thoughts.done.map(t=>`
    <div class="cab-item"><span class="voice-tag ${t.voiceCls}">${t.voiceName}</span>${escapeHtml(t.text)}</div>`).join('')
    : `<div class="cab-empty">None internalised yet.</div>`;
}
document.getElementById('cabinet-btn').onclick = ()=>{
  renderCabinet();
  document.getElementById('cabinet-modal').classList.add('show');
  document.getElementById('cabinet-badge').classList.remove('on');
};
document.getElementById('cabinet-close').onclick = ()=> document.getElementById('cabinet-modal').classList.remove('show');
document.getElementById('cabinet-modal').addEventListener('click', e=>{
  if(e.target.id==='cabinet-modal') document.getElementById('cabinet-modal').classList.remove('show');
});
function paragraphs(txt){
  return txt.split("\n\n").map(p=>`<p>${escapeHtml(p).replace(/\n/g,'<br>')}</p>`).join('');
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function clamp(n){return Math.max(0,Math.min(10,n));}
function updateStats(){
  document.getElementById('fill-clarity').style.width = (state.clarity*10)+'%';
  document.getElementById('fill-nerve').style.width = (state.nerve*10)+'%';
}

/* ---------- RETRO MINIGAME: "THE FOLD" ----------
   Triggered at the script's own blackout/fade-state beats (Ch.7, 18, 22) —
   the WORLD/MIND/GAME/RETURN doctrine's "GAME" translation layer, made literal
   as an 8-bit dodge sequence. Fail-soft: always returns to the story. */
function runMinigame(onDone){
  const overlay = document.getElementById('minigame');
  const canvas = document.getElementById('mg-canvas');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('mg-hud');
  overlay.classList.add('active');

  let player = {x:80, y:104, w:10, h:10};
  let obstacles = [];
  let t = 0;
  const DURATION = 9000; // ms
  let startTime = null;
  let dir = 0;
  let running = true;
  let hits = 0;

  function spawnObstacle(){
    obstacles.push({x: Math.random()*150+5, y:-8, w:8, h:8, speed: 1.2+Math.random()*1.3});
  }

  const leftBtn = document.getElementById('mg-left');
  const rightBtn = document.getElementById('mg-right');
  function setDir(d){ dir = d; }
  const onLeftDown=()=>setDir(-1), onRightDown=()=>setDir(1), onUp=()=>setDir(0);
  leftBtn.addEventListener('touchstart', onLeftDown); leftBtn.addEventListener('mousedown', onLeftDown);
  rightBtn.addEventListener('touchstart', onRightDown); rightBtn.addEventListener('mousedown', onRightDown);
  ['touchend','touchcancel','mouseup','mouseleave'].forEach(ev=>{
    leftBtn.addEventListener(ev,onUp); rightBtn.addEventListener(ev,onUp);
  });
  function onKey(e){
    if(e.key==='ArrowLeft') setDir(-1);
    if(e.key==='ArrowRight') setDir(1);
  }
  function onKeyUp(e){ if(e.key==='ArrowLeft'||e.key==='ArrowRight') setDir(0); }
  window.addEventListener('keydown', onKey);
  window.addEventListener('keyup', onKeyUp);

  let spawnTimer = 0;

  function loop(ts){
    if(!startTime) startTime = ts;
    const elapsed = ts - startTime;
    const remaining = Math.max(0, DURATION - elapsed);
    hud.textContent = 'THE FOLD — HOLD — ' + Math.ceil(remaining/1000) + 's';

    player.x += dir*2.2;
    player.x = Math.max(4, Math.min(146, player.x));

    spawnTimer++;
    if(spawnTimer > 26){ spawnObstacle(); spawnTimer = 0; }

    obstacles.forEach(o=> o.y += o.speed*2);
    obstacles = obstacles.filter(o=>{
      if(o.y > 120) return false;
      const hit = o.x < player.x+player.w && o.x+o.w > player.x && o.y < player.y+player.h && o.y+o.h > player.y;
      if(hit){ hits++; beep(140,0.15,'sawtooth'); return false; }
      return true;
    });

    ctx.fillStyle = '#0a0812';
    ctx.fillRect(0,0,160,120);
    // pixel starfield / fold texture
    ctx.fillStyle = 'rgba(224,153,90,0.15)';
    for(let i=0;i<12;i++){ ctx.fillRect((i*37+ (elapsed/30|0))%160, (i*53)%120, 1,1); }

    ctx.fillStyle = '#e0995a';
    ctx.fillRect(player.x, player.y, player.w, player.h);
    ctx.fillStyle = '#c9573f';
    obstacles.forEach(o=> ctx.fillRect(o.x,o.y,o.w,o.h));

    if(elapsed < DURATION && running){
      requestAnimationFrame(loop);
    } else if(running){
      finish();
    }
  }

  function finish(){
    running = false;
    hud.textContent = hits>=3 ? 'FOLD HOLDS ANYWAY' : 'YOU HOLD';
    beep(500,0.2,'square');
    setTimeout(()=>{
      overlay.classList.remove('active');
      leftBtn.removeEventListener('touchstart', onLeftDown); leftBtn.removeEventListener('mousedown', onLeftDown);
      rightBtn.removeEventListener('touchstart', onRightDown); rightBtn.removeEventListener('mousedown', onRightDown);
      window.removeEventListener('keydown', onKey);
      window.removeEventListener('keyup', onKeyUp);
      onDone();
    }, 700);
  }

  requestAnimationFrame(loop);
}

/* ---------- PERSISTENCE ---------- */
async function saveState(){
  try{ if(window.storage) await window.storage.set('tmg-save', JSON.stringify(state)); }catch(e){}
}
async function loadState(){
  try{
    if(window.storage){
      const r = await window.storage.get('tmg-save');
      if(r && r.value) state = JSON.parse(r.value);
    }
  }catch(e){}
  render();
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}

loadState();
</script>
